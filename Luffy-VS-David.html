<script>

  if (!counter) {
    impact(c.x, c.y, 3.2, GC); ring(c.x, c.y, 16 * U, GC, .5, 4); S.launch(G.dir * U * rr(170, 210), -U * rr(35, 50)); tw(b, { x: c.x + G.dir * 7 * U }, .1); yield .2;
    tw(G.rf, { k: 0, fist: 0 }, .25, 'back', G); tw(G.rb, { k: 0, fist: 0 }, .25, 'back', G); yield .3; P(G, 'guard', .12);
    yield* until(() => !S.phys, 5);
  } else {
    ring(c.x, c.y, 10 * U, GC, .3, 2); S.dir = G.dir; S.ghost = false; P(S, 'kick', .07); yield .07;
    impact(G.x, GY - 4.5 * U, 2, SC); tw(G.rf, { k: 0, fist: 0 }, .2, 'out', G); tw(G.rb, { k: 0, fist: 0 }, .2, 'out', G);
    G.launch(G.dir * U * 90, -U * 40); P(S, 'guard', .15);
    yield* until(() => !G.phys, 5);
  }
}

const SEQ = { trade: seqTrade, giantfist: seqGiantFist, gatling: seqGatling, bullets: seqBullets, lightning: seqLightning, ground: seqRubberGround, giant: seqGiant, chase: seqChase, sling: seqSling, cross: seqCross, overheat: seqOverheat, air: seqAir, whip: seqWhip, bazooka: seqBazooka };
const SETPIECES = Object.keys(SEQ).filter(k => k !== 'trade');

/* ---------- director ---------- */
function* intro() {
  faceBoth(); P(G, 'stand', .01); P(S, 'stand', .01); yield .6;
  G.cycle = 'laugh'; drum(G); yield .5; drum(G); yield .5; G.cycle = null; P(G, 'guard', .15);
  S.ghost = true; ring(S.x, S.y - 5 * U, 12 * U, TEAL, .4, 3); P(S, 'guard', .12); yield .3; S.ghost = false; yield .2;
}
function* main(skipIntro) {
  if (!skipIntro) yield* intro();
  let bag = [], since = 0, lastZone = zone(G.x), lastTrade = false;
  while (true) {
    let name;
    if (FORCE && SEQ[FORCE]) name = FORCE;
    else {
      const z = zone((G.x + S.x) / 2); if (z === lastZone) since++; else { since = 0; lastZone = z; }
      if (MONS > 1 && since >= 3) { name = 'chase'; since = 0; }
      else if (!lastTrade && rnd() < .45) name = 'trade';
      else { if (!bag.length) bag = SETPIECES.slice().sort(() => rnd() - .5); name = bag.pop(); }
    }
    lastTrade = name === 'trade'; curSeq = name; seqStart = time;
    yield* SEQ[name]();
    yield* settle();
    yield rr(.15, .5);
  }
}
function clearWorld() {
  procs = []; tweens.length = 0; bullets = []; marks = []; gwave = null; jav = null; fx = fx.filter(f => f.k !== 'mark');
  wts = 1; sand = false; freeze = 0;
}
function resetAll() {
  clearWorld(); fx = []; ghosts = [];
  const c = zoneX((MONS / 2) | 0); G.reset(c - 9 * U); S.reset(c + 9 * U); faceBoth(); seqStart = time; spawn(main(false));
}
function restart() { // soft recovery: keep positions, restart the director
  clearWorld();
  for (const a of [G, S]) { const x = cx(isFinite(a.x) ? a.x : W / 2); a.reset(x); }
  if (abs(G.x - S.x) < U) S.x = cx(G.x + 10 * U);
  faceBoth(); seqStart = time; spawn(main(true));
}
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight; U = max(6, H / 56); GY = Math.round(H * .86);
  EDGE = 4 * U; MONS = max(1, Math.round(W / H / 1.78)); MELEE = 5.4 * U;
  resetAll();
}

/* ---------- frame ---------- */
function frame(dt) {
  time += dt;
  let d = dt; if (freeze > 0) { freeze -= dt; d = dt * .05; }
  sdt = d; shake *= Math.exp(-dt * 9); sandA += ((sand ? 1 : 0) - sandA) * min(1, dt * 10);
  try {
    stepProcs(d); stepTweens(d); G.update(d); S.update(d); stepBullets(d * wts); stepFx(d);
    if (time - seqStart > 40 || !isFinite(G.x + G.y + S.x + S.y)) restart();
  } catch (e) { lastErr = (curSeq || '?') + ': ' + (e && e.stack || e); console.error(lastErr); restart(); }
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (shake > .3) ctx.translate(rr(-1, 1) * shake, rr(-1, 1) * shake);
  if (sandA > .02) {
    ctx.strokeStyle = TEAL; ctx.lineWidth = 1.5; ctx.globalAlpha = .13 * sandA; ctx.beginPath();
    for (let i = 0; i < 28; i++) {
      const y = hs(i + 1) * H, len = 150 + hs(i * 3.7) * 400, x = ((hs(i * 9.1) * W + time * W * .5 * (.4 + hs(i * 5.3))) % (W + 800)) - 400;
      ctx.moveTo(x, y); ctx.lineTo(x + len, y);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (gwave && gwave.amp > .05) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = .45 * U; ctx.lineCap = 'round'; ctx.beginPath();
    for (let i = -34; i <= 34; i++) { const x = gwave.x + i * U, y = GY - gwave.amp * U * Math.exp(-((i / 6) ** 2)) * (1 + .15 * sin(time * 30 + i)); if (i === -34) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.globalAlpha = min(1, gwave.amp / 3); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const g of ghosts) drawFig(g.J, 'hsl(' + g.hue + ',100%,60%)', .55 * (1 - g.t), true);
  const Jg = G.joints(), Js = S.joints();
  if (sandA > .3) { ctx.save(); ctx.translate(-3, 0); drawFig(Jg, '#00e5ff', .45, true); ctx.translate(6, 0); drawFig(Jg, '#ff2bd6', .45, true); ctx.restore(); }
  if (G.gat) {
    const f = G.gatT * 26 | 0; ctx.strokeStyle = ctx.fillStyle = GC; ctx.lineWidth = Jg.lw; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = (hs(i * 7.3 + f * 1.7) - .5) * .75, L = (8 + hs(i * 3.1 + f * 2.3) * 8) * U, x = Jg.nk[0] + cos(a) * L * G.dir, y = Jg.nk[1] + sin(a) * L + U;
      ctx.globalAlpha = .5 + .5 * hs(i + f); ctx.beginPath(); ctx.moveTo(Jg.nk[0], Jg.nk[1]); ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, U * 1.05, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  drawFig(Jg, GC, 1); drawToon(Jg);
  if (G.hold) drawBolt(Jg.h1[0] - G.dir * 5 * U, Jg.h1[1] + 2 * U, Jg.h1[0] + G.dir * 7 * U, Jg.h1[1] - 3 * U, 4);
  if (S.glitch) {
    ctx.save(); ctx.translate(-4 + rr(-2, 2), 0); drawFig(Js, '#ff2b2b', .6, true); ctx.translate(8, 0); drawFig(Js, '#00e5ff', .6, true); ctx.restore();
    if (rnd() > .12) { ctx.save(); ctx.translate(rr(-2, 2), 0); drawFig(Js, SC, 1); ctx.restore(); }
  } else drawFig(Js, SC, 1);
  if (S.ghost || sandA > .1) { ctx.strokeStyle = TEAL; ctx.lineWidth = Js.lw * .45; ctx.globalAlpha = .9; ctx.beginPath(); ctx.moveTo(Js.hip[0], Js.hip[1]); ctx.lineTo(Js.nk[0], Js.nk[1]); ctx.stroke(); ctx.globalAlpha = 1; }
  ctx.strokeStyle = '#fff3a0'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
  for (const b of bullets) { const L = Math.hypot(b.vx, b.vy) || 1, k = b.st === 1 ? .6 * U : 3.5 * U; ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / L * k, b.y - b.vy / L * k); }
  ctx.stroke();
  if (jav) drawBolt(jav.x - jav.dx * 14 * U, jav.y - jav.dy * 14 * U, jav.x, jav.y, 5);
  drawFx();
}
let last = 0;
function loop(ts) {
  const dt = min(.05, (ts - last) / 1000 || 0); last = ts;
  if (dt > 0) frame(dt * SPEED); render(); requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
resize(); requestAnimationFrame(loop);

// debug: run every pattern headlessly and report script errors
window.selftest = function (secs = 60) {
  const rep = {}, keep = FORCE;
  for (const k of Object.keys(SEQ)) {
    FORCE = k; lastErr = null; resetAll(); let bad = 0;
    for (let i = 0; i < secs * 60; i++) { frame(1 / 60); if (lastErr) break; if (!isFinite(G.x + S.x + G.y + S.y)) { bad = 1; break; } }
    rep[k] = lastErr || (bad ? 'NaN' : 'ok');
  }
  FORCE = keep; lastErr = null; resetAll(); return rep;
};
</script>
